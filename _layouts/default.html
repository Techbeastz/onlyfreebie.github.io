<!DOCTYPE html>
<html>
<head>
  <title>{{ page.title }}</title>
  <style>
    .toc { background: #f5f5f5; padding: 15px; border-left: 4px solid #007cba; margin: 20px 0; }
    .toc h2 { font-size: 1.2em; margin-top: 0; color: #333; }
    .toc ul { list-style: none; padding: 0; }
    .toc li { margin: 5px 0; padding-left: 10px; }
    .toc a { color: #007cba; text-decoration: none; }
    .toc a:hover { text-decoration: underline; }
    html { scroll-behavior: smooth; }
    .content { max-width: 800px; margin: 0 auto; }
    .sidebar { float: right; width: 25%; }
  </style>
</head>
<body>
  <div class="sidebar">
    {% include toc.html html=content h_min=2 %}
  </div>
  <div class="content">
    <h1>{{ page.title }}</h1>  <!-- H1 ignored -->
    {{ content }}
  </div>
</body>
</html>
